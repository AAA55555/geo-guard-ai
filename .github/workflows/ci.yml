name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Full suite: typecheck, units, e2e and the packed-tarball check.
  # The Node axis lives here because it is the cheap runner — the engines floor
  # (18.20) and the current release are both about Node behaviour, not the OS.
  #
  # No Linux-only step: the one place the platforms used to differ — which login
  # file bash reads, ~/.profile on most distributions and ~/.bash_profile on a
  # fresh macOS account — is now decided by which file exists, not by
  # process.platform, so the unit suite covers it here in a temporary HOME.
  test:
    name: ubuntu / node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20', '20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:pack

  # macOS has one branch of its own — rcPathForShell falls back to
  # ~/.bash_profile there, because a login bash shell on macOS reads that and
  # not ~/.bashrc — and the POSIX suites run fine on it. One Node is enough:
  # the version axis is Ubuntu's job, this one is about the platform.
  macos:
    name: macos / node ${{ matrix.node }}
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:e2e
      - run: npm run test:pack

  # Windows has a real code surface of its own — the powershell branch of
  # shell-alias, the user PATH in HKCU\Environment (windows-path), %APPDATA% in
  # config, PATHEXT in resolve-bin, spawning a .cmd in run — and nothing used to
  # exercise it.
  #
  # Not repeated here: typecheck (tsc is platform-independent), test:e2e and
  # test:pack (both are POSIX-only sh scripts that skip themselves on Windows,
  # so running them would only print "skipped" and report a green that means
  # nothing). scripts/windows-smoke.ps1 covers that ground instead.
  #
  # Node axis trimmed to the floor and the current release: 20 in the middle
  # adds runtime without adding a code path.
  windows:
    name: windows / node ${{ matrix.node }}
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    strategy:
      fail-fast: false
      matrix:
        node: ['18.20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build

      # Blocking: every assertion in it fails the job when the win32 path breaks.
      - name: Windows smoke test
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/windows-smoke.ps1

      # Not `npm test`: npm runs scripts through cmd.exe on Windows, which does
      # not expand `test/*.test.cjs`, and only Node 22 expands that glob itself.
      # The files are listed explicitly instead, so this behaves the same on
      # every Node in the matrix. (dist/ is already built by the step above.)
      #
      # The suite turned out to be portable as written — temp dirs via
      # os.tmpdir(), paths via path.join(), USERPROFILE set alongside HOME
      # everywhere — and it passed here on the first green run, so it blocks like
      # everything else. It has already earned its place: this job is what caught
      # spawn refusing to launch a .cmd.
      - name: Unit suite
        run: |
          $files = Get-ChildItem -Path test -Filter *.test.cjs | ForEach-Object { $_.FullName }
          node --test @files
